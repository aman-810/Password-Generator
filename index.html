<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>generate_password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="container my-5 w-75">
        <div class="text-center">
            <h1 class="fw-bold text-primary">Password Generator</h1>
            <p class="mt-2">Generate strong, secure and random Password</p>
        </div>
            <div class="card shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h4 class="mb-3">Generate Password</h4>
                    <div class="input-group input-group-lg mb-3">
                        <input type="text" value="Abce@sd542" id="txt" readonly class="form-control">
                        <button class="btn btn-primary" id="cpbtn">Copy</button>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Strength</span>
                        <span class="text-success fw-bold">Strong</span>
                    </div>
                    <div class="progress mt-2">
                        <div class="progress-bar bg-success w-100"></div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-4 rounded-4">
                <div class="card-body p-4">
                    <h4>Password Option</h4>
                    <div class="d-flex justify-content-between align-items-center">
                        <label>Password Length</label>
                        <span class="badge bg-success" id="rangeval">16</span>    
                    </div>
                    <input type="range" class="form-range" min="4" max="32" id="range" value="16">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="uppercase">
                                <label class="form-check-label" for="uppercase">Include Uppercase (A-Z)</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="lowercase">
                                <label class="form-check-label" for="lowercase">Include Lowercase (a-z)</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="nums">
                                <label class="form-check-label" for="nums">Include Number (0-9)</label>
                            </div>
                        </div>  
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="sym">
                                <label class="form-check-label" for="sym">Include Symbol (@#$*&_!)</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
                <button class="btn btn-primary btn-lg w-100 mt-3" id="btn">Generate Password</button>
            
        
    </div>
